swagger: "2.0"
info:
  title: API Colaboración ONG
  description: >
    API para gestionar la colaboración entre ONGs mediante pedidos y compromisos.
    Incluye autenticación JWT, registro de proyectos completos con pedidos,
    consulta de pedidos no asignados y registro de compromisos.
  version: "1.0.1"
  contact:
    name: Equipo de Desarrollo
    email: equipo@colaboracion.org

basePath: /api

securityDefinitions:
  BearerAuth:
    type: apiKey
    name: Authorization
    in: header
    description: "Token JWT en formato: Bearer {token}"

security:
  - BearerAuth: []

tags:
  - name: Autenticación
    description: Obtener token JWT
  - name: Pedidos
    description: Operaciones sobre pedidos de colaboración
  - name: Compromisos
    description: Operaciones sobre compromisos de ONGs

paths:
  /auth/token:
    post:
      tags:
        - Autenticación
      summary: Obtener token JWT para autenticación
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [email, password, bonita_user]
            properties:
              email:
                type: string
                example: ayudatotal@ong.com
              password:
                type: string
                example: "1234"
              bonita_user:
                type: string
                example: walter.bates
      responses:
        200:
          description: Token JWT generado
          schema:
            type: object
            properties:
              access_token:
                type: string
        401:
          description: Credenciales inválidas

  /pedidos/:
    post:
      security:
        - BearerAuth: []
      tags:
        - Pedidos
      summary: Crear un nuevo pedido de colaboración junto con un proyecto completo
      description: >
        Crea un **proyecto completo** y automáticamente asocia un **pedido** a ese proyecto.  
        Ya no se acepta `project_id`.  
        Siempre se debe enviar el objeto `project` completo.
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [project, type]
            properties:
              project:
                type: object
                description: Proyecto completo con planes incluidos.
                required: [name, description, type, country, neighborhood]
                properties:
                  name:
                    type: string
                    example: Proyecto Solar
                  description:
                    type: string
                    example: Instalación de paneles solares en escuelas rurales
                  type:
                    type: string
                    example: materiales
                  country:
                    type: string
                    example: Argentina
                  neighborhood:
                    type: string
                    example: Palermo
                  work_plans:
                    type: array
                    items:
                      type: object
                      required: [name, start_date, end_date]
                      properties:
                        name:
                          type: string
                          example: Instalación
                        start_date:
                          type: string
                          example: 2025-01-01
                        end_date:
                          type: string
                          example: 2025-01-20
                  economic_plans:
                    type: array
                    items:
                      type: object
                      required: [type, amount, description]
                      properties:
                        type:
                          type: string
                          example: materiales
                        amount:
                          type: number
                          example: 5000
                        description:
                          type: string
                          example: Compra de paneles solares
              type:
                type: string
                description: Tipo de ayuda solicitada
                example: materiales
              description:
                type: string
                example: Solicitan materiales no perecederos
              amount:
                type: number
                example: 5000
      responses:
        201:
          description: Pedido y proyecto creados correctamente
          schema:
            type: object
            properties:
              msg:
                type: string
                example: Pedido creado correctamente
              id:
                type: integer
                example: 1
              project_id:
                type: integer
                example: 10
        400:
          description: Error al crear el proyecto o pedido
          schema:
            type: object
            properties:
              msg:
                type: string

  /pedidos/proyecto/{project_id}/no-asignados:
    get:
      security:
        - BearerAuth: []
      tags:
        - Pedidos
      summary: Obtener los pedidos no asignados de un proyecto
      description: >
        Devuelve los pedidos de colaboración no asignados para un proyecto existente.
      parameters:
        - name: project_id
          in: path
          required: true
          type: integer
          example: 3
      responses:
        200:
          description: Lista de pedidos no asignados
          schema:
            type: object
            properties:
              msg:
                type: string
              requests:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    type: { type: string }
                    description: { type: string }
                    amount: { type: number }
        404:
          description: Proyecto no encontrado
          schema:
            type: object
            properties:
              msg:
                type: string

  /compromisos/:
    get:
      security:
        - BearerAuth: []
      tags:
        - Compromisos
      summary: Listar todos los compromisos registrados
      responses:
        200:
          description: Lista de compromisos
          schema:
            type: object
            properties:
              msg: { type: string }
              commitments:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    request_id: { type: integer }
                    ong_name: { type: string }
                    help_type: { type: string }
                    fulfilled: { type: boolean }

    post:
      security:
        - BearerAuth: []
      tags:
        - Compromisos
      summary: Registrar un compromiso con un pedido
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [request_id, ong_name, help_type]
            properties:
              request_id:
                type: integer
                example: 1
              ong_name:
                type: string
                example: ONG Esperanza
              help_type:
                type: string
                example: Donación de alimentos
      responses:
        201:
          description: Compromiso registrado correctamente
          schema:
            type: object
            properties:
              msg: { type: string }
              id: { type: integer }
        400:
          description: El pedido ya tiene un compromiso
        404:
          description: Pedido no encontrado

  /compromisos/{id}/cumplido:
    patch:
      security:
        - BearerAuth: []
      tags:
        - Compromisos
      summary: Marcar un compromiso como cumplido
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          example: 1
      responses:
        200:
          description: Compromiso marcado como cumplido
          schema:
            type: object
            properties:
              msg: { type: string }
        400:
          description: Compromiso ya cumplido
        404:
          description: Compromiso no encontrado

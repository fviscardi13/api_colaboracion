swagger: "2.0"

info:
  title: API Colaboración ONG
  description: >
    API para gestionar la colaboración entre ONGs mediante pedidos y compromisos.
    Ahora un pedido puede enviarse de dos formas:
    1. Usando un project_id → Se utiliza un proyecto existente.
    2. Enviando un project completo → Se crea un proyecto nuevo automáticamente.

    Si el proyecto enviado contiene bonita_case_id, el sistema buscará un
    proyecto existente con ese identificador para evitar duplicados.
  version: "1.1.1"
  contact:
    name: Equipo de Desarrollo
    email: equipo@colaboracion.org


host: localhost:5000
basePath: /api
schemes:
  - http

securityDefinitions:
  BearerAuth:
    type: apiKey
    name: Authorization
    in: header
    description: Token JWT en formato Bearer {token}

security:
  - BearerAuth: []

tags:
  - name: Autenticación
    description: Obtener token JWT
  - name: Pedidos
    description: Operaciones sobre pedidos de colaboración
  - name: Compromisos
    description: Operaciones sobre compromisos de ONGs

paths:

  /auth/token:
    post:
      tags:
        - Autenticación
      summary: Obtener token JWT para autenticación
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - email
              - password
              - bonita_user
            properties:
              email:
                type: string
                example: ayudatotal@ong.com
              password:
                type: string
                example: "1234"
              bonita_user:
                type: string
                example: walter.bates
      responses:
        200:
          description: Token JWT generado
          schema:
            type: object
            properties:
              access_token:
                type: string
        401:
          description: Credenciales inválidas

  /pedidos/:
    post:
      security:
        - BearerAuth: []
      tags:
        - Pedidos
      summary: Crear un nuevo pedido de colaboración
      description: >
        Crea un pedido y lo asocia a un proyecto.

        Formas válidas de enviar un pedido:

        1. Usar proyecto existente → enviar project_id.
        2. Crear proyecto nuevo → enviar project completo.

        Si incluye bonita_case_id:
          - Si existe → se reutiliza.
          - Si no existe → se crea uno nuevo.

        Regla: No se puede enviar project_id y project al mismo tiempo.
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            properties:
              project_id:
                type: integer
                example: 7
              project:
                type: object
                properties:
                  bonita_case_id:
                    type: string
                    example: BONITA-CASE-12345
                  name:
                    type: string
                    example: Proyecto Solar
                  description:
                    type: string
                    example: Instalación de paneles solares
                  type:
                    type: string
                    example: materiales
                  country:
                    type: string
                    example: Argentina
                  neighborhood:
                    type: string
                    example: Palermo
                  work_plans:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: Instalación
                        start_date:
                          type: string
                          example: "2025-01-01"
                        end_date:
                          type: string
                          example: "2025-01-20"
                  economic_plans:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          example: materiales
                        amount:
                          type: number
                          example: 5000
                        description:
                          type: string
                          example: Compra de paneles solares
              type:
                type: string
                example: materiales
              description:
                type: string
                example: Solicitan materiales no perecederos
              amount:
                type: number
                example: 5000
      responses:
        201:
          description: Pedido creado correctamente
          schema:
            type: object
            properties:
              msg:
                type: string
              id:
                type: integer
              project_id:
                type: integer
        400:
          description: Error general
          schema:
            type: object
            properties:
              msg:
                type: string
        404:
          description: project_id no encontrado
          schema:
            type: object
            properties:
              msg:
                type: string

  /pedidos/proyecto/{project_id}/no-asignados:
    get:
      security:
        - BearerAuth: []
      tags:
        - Pedidos
      summary: Obtener los pedidos no asignados de un proyecto
      parameters:
        - name: project_id
          in: path
          required: true
          type: integer
          example: 3
      responses:
        200:
          description: Lista de pedidos no asignados
        404:
          description: Proyecto no encontrado

  /compromisos/:
    get:
      security:
        - BearerAuth: []
      tags:
        - Compromisos
      summary: Listar todos los compromisos registrados
    post:
      security:
        - BearerAuth: []
      tags:
        - Compromisos
      summary: Registrar un compromiso con un pedido
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - request_id
              - ong_name
              - help_type
            properties:
              request_id:
                type: integer
              ong_name:
                type: string
              help_type:
                type: string

  /compromisos/{id}/cumplido:
    patch:
      security:
        - BearerAuth: []
      tags:
        - Compromisos
      summary: Marcar un compromiso como cumplido
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          example: 1
      responses:
        200:
          description: OK

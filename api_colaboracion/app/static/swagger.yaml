swagger: "2.0"
info:
  title: API Colaboración ONG
  description: >
    API para gestionar la colaboración entre ONGs mediante pedidos y compromisos.
    Incluye autenticación JWT, registro de pedidos, consulta de pedidos no asignados
    y registro de compromisos de ayuda.
  version: "1.0.0"
  contact:
    name: Equipo de Desarrollo
    email: equipo@colaboracion.org

host: localhost:5000
basePath: /api
schemes:
  - http

securityDefinitions:
  BearerAuth:
    type: apiKey
    name: Authorization
    in: header
    description: "Token JWT en formato: Bearer {token}"

security:
  - BearerAuth: []

tags:
  - name: Autenticación
    description: Obtener token JWT
  - name: Pedidos
    description: Operaciones sobre pedidos de colaboración
  - name: Compromisos
    description: Operaciones sobre compromisos de ONGs

paths:
  /auth/token:
    post:
      tags:
        - Autenticación
      summary: Obtener token JWT para autenticación
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [email, password, bonita_user]
            properties:
              email:
                type: string
                example: ayudatotal@ong.com
              password:
                type: string
                example: "1234"
              bonita_user:
                type: string
                example: walter.bates
      responses:
        200:
          description: Token JWT generado
          schema:
            type: object
            properties:
              access_token:
                type: string
                example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        401:
          description: Credenciales inválidas

  /pedidos/:
    post:
      security:
        - BearerAuth: []
      tags:
        - Pedidos
      summary: Crear un nuevo pedido de colaboración para un proyecto
      description: >
        Crea un pedido de colaboración vinculado a un proyecto específico.  
        Cada proyecto puede tener **un solo pedido asociado**.  
        Si el proyecto no existe o ya tiene un pedido, se devuelve un error.
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [project_id, type]
            properties:
              project_id:
                type: integer
                example: 3
              type:
                type: string
                example: materiales
              description:
                type: string
                example: Solicitan alimentos no perecederos
              amount:
                type: number
                example: 5000
      responses:
        201:
          description: Pedido creado correctamente
          schema:
            type: object
            properties:
              msg:
                type: string
                example: Pedido de colaboración creado correctamente para el proyecto 3.
              id:
                type: integer
                example: 10
        400:
          description: Error en la solicitud (proyecto ya tiene un pedido o falta 'project_id')
          schema:
            type: object
            properties:
              msg:
                type: string
                example: El proyecto con ID 1 ya tiene un pedido de colaboración asignado.
        404:
          description: Proyecto no encontrado
          schema:
            type: object
            properties:
              msg:
                type: string
                example: No existe un proyecto con ID 999

  /pedidos/proyecto/{project_id}/no-asignados:
    get:
      security:
        - BearerAuth: []
      tags:
        - Pedidos
      summary: Obtener los pedidos de colaboración no asignados de un proyecto
      description: >
        Devuelve los pedidos de colaboración que existen para un proyecto específico y que **no han sido asignados**.  
        Casos posibles:
        - Si el proyecto no existe, devuelve 404.
        - Si el proyecto existe pero no tiene pedidos, devuelve un mensaje indicando que no hay pedidos.
        - Si el proyecto tiene pedidos asignados, devuelve un mensaje indicando que no hay pedidos no asignados.
        - Si hay pedidos no asignados, devuelve la lista con los datos de cada pedido.
      parameters:
        - name: project_id
          in: path
          required: true
          type: integer
          example: 3
          description: ID del proyecto del cual se quieren consultar los pedidos no asignados.
      responses:
        200:
          description: Lista de pedidos no asignados o mensaje aclaratorio si no hay ninguno
          schema:
            type: object
            properties:
              msg:
                type: string
                example: Pedidos no asignados del proyecto 3
              requests:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 7
                    type:
                      type: string
                      example: materiales
                    description:
                      type: string
                      example: Solicitan materiales para construcción
                    amount:
                      type: number
                      example: 5000
        404:
          description: Proyecto no encontrado
          schema:
            type: object
            properties:
              msg:
                type: string
                example: No existe un proyecto con ID 999

  /compromisos/:
    get:
      security:
        - BearerAuth: []
      tags:
        - Compromisos
      summary: Listar todos los compromisos registrados
      responses:
        200:
          description: Lista de compromisos o mensaje si no hay ninguno
          schema:
            type: object
            properties:
              msg:
                type: string
                example: No hay compromisos registrados actualmente.
              commitments:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    request_id: { type: integer }
                    ong_name: { type: string }
                    help_type: { type: string }
                    fulfilled: { type: boolean }

    post:
      security:
        - BearerAuth: []
      tags:
        - Compromisos
      summary: Crear un nuevo compromiso (una ONG se compromete con un pedido)
      description: >
        Registra un compromiso de una ONG con un pedido específico.  
        Cada pedido puede tener **un solo compromiso registrado**.  
        Si el pedido no existe o ya tiene un compromiso, devuelve un error.
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [request_id, ong_name, help_type]
            properties:
              request_id:
                type: integer
                example: 1
              ong_name:
                type: string
                example: ONG Futuro
              help_type:
                type: string
                example: Donación de materiales
      responses:
        201:
          description: Compromiso registrado correctamente
          schema:
            type: object
            properties:
              msg:
                type: string
                example: Compromiso registrado correctamente
              id:
                type: integer
                example: 5
        400:
          description: Ya existe un compromiso para este pedido
          schema:
            type: object
            properties:
              msg:
                type: string
                example: El pedido con ID 1 ya tiene un compromiso registrado.
        404:
          description: Pedido no encontrado
          schema:
            type: object
            properties:
              msg:
                type: string
                example: No existe un pedido de colaboración con ID 999

  /compromisos/{id}/cumplido:
    patch:           
      security:
        - BearerAuth: []
      tags:
        - Compromisos
      summary: Marcar un compromiso como cumplido
      description: >
        Marca como cumplido un compromiso existente.  
        - Devuelve 404 si el compromiso no existe.  
        - Devuelve 400 si el compromiso ya estaba cumplido.
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          example: 1
      responses:
        200:
          description: Compromiso marcado como cumplido
          schema:
            type: object
            properties:
              msg:
                type: string
                example: Compromiso marcado como cumplido
        400:
          description: Compromiso ya cumplido
          schema:
            type: object
            properties:
              msg:
                type: string
                example: El compromiso con ID 1 ya está marcado como cumplido
        404:
          description: Compromiso no encontrado
          schema:
            type: object
            properties:
              msg:
                type: string
                example: No existe un compromiso con ID 1
